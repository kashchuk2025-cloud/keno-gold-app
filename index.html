<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="color-scheme" content="dark">
  <title>KENO / 80 — Blue Motion</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --app-height: 100dvh;
      --void: #05080d;
      --black: #080d14;
      --ink: #0d1620;
      --steel: #172633;
      --line: rgba(229, 213, 219, .18);
      --line-strong: rgba(245, 207, 216, .52);
      --white: #f7f4f5;
      --silver: #d7c8cd;
      --muted: #9b7f88;
      --blue: #719aaa;
      --blue-light: #d8edf2;
      --blue-deep: #244d60;
      --blue-glow: rgba(91, 158, 184, .14);
      --red: #f0445d;
      --red-deep: #a51f3b;
      --red-glow: rgba(240, 68, 93, .36);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      margin: 0;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(85% 55% at 50% 22%, rgba(145, 30, 57, .27), transparent 54%),
        radial-gradient(65% 45% at 104% 90%, rgba(82, 24, 43, .22), transparent 62%),
        linear-gradient(150deg, #19141a 0%, #07070b 45%, #110a10 100%);
      letter-spacing: .01em;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      opacity: .40;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 5px),
        linear-gradient(112deg, transparent 8%, rgba(255, 235, 239, .045) 30%, transparent 48%),
        linear-gradient(73deg, transparent 59%, rgba(240, 68, 93, .075) 76%, transparent 83%);
    }
    body::after { background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.70) 100%); }
    button { font: inherit; }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 620px);
      height: var(--app-height);
      margin: 0 auto;
      padding: calc(var(--safe-top) + 7px) 12px calc(var(--safe-bottom) + 8px);
    }
    .console {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: clamp(7px, 1.1dvh, 11px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 39px;
      padding: 0 4px 7px;
      border-bottom: 1px solid var(--line);
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(21px, 6.7vw, 29px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -.06em;
      color: #f7fcff;
    }
    .brand h1 b { color: var(--red); font-weight: 800; }
    .brand p {
      margin: 5px 0 0;
      color: var(--silver);
      font-size: 8px;
      font-weight: 850;
      letter-spacing: .16em;
    }
    .top-status { display: flex; align-items: center; gap: 7px; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--silver);
      font-size: 8px;
      font-weight: 850;
      letter-spacing: .11em;
    }
    .live i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 11px var(--red);
      animation: livePulse 1.9s ease-in-out infinite;
    }
    .mark { display: flex; gap: 5px; }
    .mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--silver); }
    .mark i:first-child { background: var(--red); box-shadow: 0 0 9px var(--red); }

    .game-card {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 7px;
      padding: 11px 10px 10px;
      border: 1px solid rgba(233, 98, 116, .32);
      border-radius: 21px;
      background:
        linear-gradient(135deg, rgba(255, 220, 227, .055), transparent 26% 74%, rgba(240, 68, 93, .09)),
        rgba(9, 7, 11, .76);
      box-shadow: inset 0 1px 0 rgba(255, 240, 243, .08), inset 0 0 70px rgba(173, 31, 57, .11), 0 12px 35px rgba(0,0,0,.26);
    }
    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .65;
      background:
        linear-gradient(90deg, transparent 7%, rgba(202,240,252,.055) 7.18%, transparent 7.35%, transparent 92.65%, rgba(202,240,252,.04) 92.82%, transparent 93%),
        linear-gradient(0deg, transparent 14%, rgba(202,240,252,.035) 14.15%, transparent 14.3%);
    }
    .scene-head, .stage, .choice-deck { position: relative; z-index: 1; }
    .scene-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-height: 30px; }
    .scene-kicker { margin: 0 0 3px; color: var(--red); font-size: 8px; font-weight: 900; letter-spacing: .15em; }
    .scene-head h2 { margin: 0; font-size: clamp(14px, 4.6vw, 20px); line-height: 1; letter-spacing: -.03em; }
    .round-chip {
      margin-top: 2px;
      padding: 5px 7px;
      border: 1px solid rgba(234, 156, 171, .34);
      border-radius: 999px;
      color: var(--silver);
      font-size: 7px;
      font-weight: 850;
      letter-spacing: .09em;
      white-space: nowrap;
      background: rgba(7, 16, 22, .75);
    }
    .round-chip.ready { color: #fff6f7; border-color: rgba(240, 68, 93, .72); box-shadow: 0 0 12px rgba(240, 68, 93, .16); }

    .stage {
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(235, 103, 122, .32);
      border-radius: 16px;
      background:
        radial-gradient(ellipse 58% 58% at 50% 48%, rgba(165, 27, 58, .25), transparent 64%),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(55, 104, 124, .10), transparent 70%),
        linear-gradient(145deg, rgba(43, 20, 29, .62), rgba(6, 5, 9, .75));
    }
    .stage::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%;
      top: -25%;
      width: 62%;
      height: 130%;
      transform: translateX(-50%);
      opacity: .70;
      background: linear-gradient(90deg, transparent, rgba(255, 130, 150, .19) 49%, transparent 51%);
      filter: blur(13px);
    }
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 12px;
      bottom: 12px;
      left: 13px;
      right: 13px;
      border: 1px solid rgba(246, 223, 229, .09);
      border-radius: 12px;
      box-shadow: inset 0 0 34px rgba(217, 48, 76, .10);
    }
    .scan-line {
      position: absolute;
      z-index: 0;
      top: 10%;
      bottom: 10%;
      left: 50%;
      width: 1px;
      opacity: .65;
      background: linear-gradient(180deg, transparent, rgba(255,183,194,.47) 16%, rgba(240,68,93,.19) 82%, transparent);
      box-shadow: 0 0 15px rgba(240,68,93,.34);
    }
    .stage-caption {
      position: absolute;
      z-index: 4;
      left: 12px;
      right: 12px;
      bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 23px;
      padding: 4px 9px;
      border: 1px solid rgba(239, 186, 197, .18);
      border-radius: 8px;
      color: var(--silver);
      font-size: 7px;
      font-weight: 750;
      letter-spacing: .06em;
      text-align: center;
      background: rgba(3, 8, 12, .52);
    }
    .stage-caption b { margin-right: 5px; color: var(--blue-light); }

    .ambient-layer, .result-layer { position: absolute; inset: 0; }
    .ambient-layer { z-index: 1; transition: opacity .32s ease, filter .32s ease; }
    .stage.has-result .ambient-layer { opacity: .20; filter: blur(.5px); }
    .ambient-ball {
      position: absolute;
      display: grid;
      place-items: center;
      width: clamp(34px, 10.3vw, 48px);
      aspect-ratio: 1;
      border: 1px solid rgba(167, 223, 242, .34);
      border-radius: 50%;
      color: rgba(230,247,252,.64);
      font-size: clamp(8px, 2.4vw, 11px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      background:
        radial-gradient(circle at 31% 25%, rgba(255,255,255,.38), transparent 11%),
        radial-gradient(circle at 61% 66%, #3d1723 0 29%, #08070b 70%);
      box-shadow: inset -5px -7px 10px rgba(0,0,0,.62), 0 7px 16px rgba(0,0,0,.52), 0 0 13px rgba(240,68,93,.17);
      animation: ambientFloat var(--duration) ease-in-out infinite alternate, ballTurn calc(var(--duration) * 1.8) linear infinite;
    }
    .ambient-ball::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(121, 206, 235, .20);
      border-radius: 50%;
    }
    .a1 { left: 16%; top: 24%; --duration: 4.3s; }
    .a2 { left: 66%; top: 19%; --duration: 5.2s; }
    .a3 { left: 73%; top: 52%; --duration: 4.6s; }
    .a4 { left: 21%; top: 61%; --duration: 5.8s; }
    .a5 { left: 47%; top: 39%; --duration: 4.9s; width: clamp(28px, 8.3vw, 39px); }
    .a6 { left: 46%; top: 70%; --duration: 5.5s; width: clamp(27px, 8vw, 37px); }

    .result-layer { z-index: 3; pointer-events: none; }
    .result-ball {
      position: absolute;
      left: var(--x);
      top: var(--y);
      display: grid;
      place-items: center;
      width: clamp(38px, 11.4vw, 53px);
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(219, 243, 251, .88);
      border-radius: 50%;
      color: #fbfeff;
      font-size: clamp(12px, 3.5vw, 16px);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      background:
        radial-gradient(circle at 31% 24%, rgba(255,255,255,.86), rgba(215,247,255,.25) 10%, transparent 18%),
        radial-gradient(circle at 62% 68%, #4a1827 0 29%, #08070c 70%);
      box-shadow: inset -6px -8px 11px rgba(0,0,0,.58), inset 2px 2px 5px rgba(255,242,245,.30), 0 0 0 4px rgba(240,68,93,.08), 0 8px 17px rgba(0,0,0,.48), 0 0 17px rgba(240,68,93,.29);
      transform: translate(-50%, -50%);
      animation: ballReveal 640ms cubic-bezier(.18,.84,.26,1) both;
      animation-delay: var(--delay);
    }
    .result-ball::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(250, 155, 171, .53);
      border-radius: 50%;
    }
    .result-ball.hot { border-color: rgba(255, 218, 224, .94); box-shadow: inset -6px -8px 11px rgba(0,0,0,.58), inset 2px 2px 5px rgba(255,240,243,.28), 0 0 0 4px rgba(230,59,88,.07), 0 8px 17px rgba(0,0,0,.48), 0 0 17px rgba(230,59,88,.26); }

    .choice-deck {
      padding: 8px;
      border: 1px solid rgba(231, 109, 128, .25);
      border-radius: 13px;
      background: rgba(4, 10, 14, .71);
      box-shadow: inset 0 1px 0 rgba(232,250,255,.04);
    }
    .deck-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 1px 6px; }
    .deck-head span:first-child { color: var(--silver); font-size: 8px; font-weight: 850; letter-spacing: .12em; }
    .deck-head span:last-child { color: var(--blue); font-size: 8px; font-weight: 850; letter-spacing: .08em; }
    .size-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .size-button {
      position: relative;
      min-height: 38px;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(233, 171, 184, .32);
      border-radius: 9px;
      color: var(--white);
      font-size: 12px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(151, 30, 57, .26), rgba(12, 8, 12, .96));
      transition: transform .16s ease, border-color .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .size-button::after {
      content: "";
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: 3px;
      height: 1px;
      opacity: 0;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }
    .size-button:focus-visible, .size-button:hover { outline: none; border-color: rgba(255, 169, 185, .88); color: #fff7f8; box-shadow: 0 0 13px rgba(240,68,93,.18); }
    .size-button:active { transform: scale(.94); }
    .size-button.selected {
      border-color: rgba(248, 219, 225, .73);
      color: #fff;
      background: linear-gradient(135deg, rgba(166, 34, 61, .65), rgba(21, 26, 34, .98));
      box-shadow: 0 0 16px rgba(230,59,88,.18), inset 0 1px 0 rgba(255,237,241,.10);
    }
    .size-button.selected::after { opacity: 1; }
    .size-button:disabled { opacity: .46; cursor: wait; }

    .action-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px;
      gap: 7px;
      padding: 7px;
      border: 1px solid rgba(232, 115, 133, .28);
      border-radius: 16px;
      background: rgba(7, 13, 18, .82);
      box-shadow: inset 0 1px 0 rgba(232,250,255,.05);
    }
    .new-button, .auto-button { cursor: pointer; }
    .new-button {
      min-height: 37px;
      border: 1px solid rgba(255, 181, 194, .78);
      border-radius: 10px;
      color: #fff8f9;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .10em;
      background: linear-gradient(100deg, #8e1f38, #ea4d64 52%, #a62442);
      box-shadow: 0 5px 17px rgba(0,0,0,.23), 0 0 18px rgba(240,68,93,.27);
    }
    .new-button::before { content: "◆"; margin-right: 7px; }
    .new-button:active, .auto-button:active { transform: scale(.98); }
    .new-button:disabled { opacity: .52; color: #d2e9f0; cursor: not-allowed; background: linear-gradient(100deg, #203d4c, #4c707e, #254754); }
    .auto-button {
      min-height: 37px;
      border: 1px solid rgba(235, 184, 194, .45);
      border-radius: 10px;
      color: var(--white);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .1em;
      background: linear-gradient(135deg, rgba(91, 61, 82, .58), rgba(13, 8, 13, .96));
    }
    .auto-button:disabled { opacity: .48; cursor: wait; }

    .footer-line {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      color: #70818a;
      font-size: 7px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .footer-line b { color: var(--red); font-weight: 900; }

    @keyframes livePulse { 0%,100% { transform: scale(.78); opacity: .48; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes ambientFloat { from { translate: -4px -5px; } to { translate: 5px 6px; } }
    @keyframes ballTurn { from { rotate: -7deg; } to { rotate: 7deg; } }
    @keyframes ballReveal {
      0% { opacity: 0; transform: translate(-50%, calc(-50% - 58px)) scale(.30) rotate(-18deg); }
      62% { opacity: 1; transform: translate(-50%, calc(-50% + 4px)) scale(1.08) rotate(5deg); }
      83% { transform: translate(-50%, calc(-50% - 2px)) scale(.97) rotate(-2deg); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    }

    @media (max-height: 640px) {
      .app { padding-top: calc(var(--safe-top) + 4px); padding-bottom: calc(var(--safe-bottom) + 5px); }
      .console { gap: 6px; }
      .topbar { min-height: 32px; padding-bottom: 4px; }
      .brand p { margin-top: 3px; font-size: 7px; }
      .game-card { padding: 8px 8px 8px; border-radius: 17px; gap: 5px; }
      .scene-head { min-height: 24px; }
      .scene-kicker { font-size: 7px; margin-bottom: 2px; }
      .round-chip { padding: 4px 6px; font-size: 6px; }
      .stage { border-radius: 13px; }
      .stage-caption { bottom: 7px; min-height: 18px; font-size: 6px; }
      .choice-deck { padding: 6px; }
      .deck-head { margin-bottom: 4px; }
      .deck-head span { font-size: 7px !important; }
      .size-grid { gap: 4px; }
      .size-button { min-height: 32px; font-size: 10px; }
      .action-row { padding: 5px; }
      .new-button, .auto-button { min-height: 32px; font-size: 8px; }
      .footer-line { font-size: 6px; }
    }
    @media (max-width: 350px) {
      .app { padding-inline: 8px; }
      .live { display: none; }
      .game-card { padding-inline: 7px; }
      .size-grid { gap: 4px; }
      .action-row { grid-template-columns: minmax(0, 1fr) 55px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="console" aria-label="Игровой кабинет Keno 80">
      <header class="topbar">
        <div class="brand">
          <h1>KENO <b>/ 80</b></h1>
          <p>BLUE MOTION · BLACK MIRROR</p>
        </div>
        <div class="top-status">
          <span class="live"><i></i> ИГРА</span>
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
      </header>

      <section class="game-card" aria-labelledby="sceneTitle">
        <header class="scene-head">
          <div>
            <p class="scene-kicker">ЖИВОЕ ПОЛЕ · 1—80</p>
            <h2 id="sceneTitle">ДВИЖЕНИЕ ШАРОВ</h2>
          </div>
          <span class="round-chip" id="roundChip">ВЫБЕРИ 01—10</span>
        </header>

        <section class="stage" id="stage" aria-label="Анимационная сцена с шарами">
          <span class="scan-line" aria-hidden="true"></span>
          <div class="ambient-layer" aria-hidden="true">
            <span class="ambient-ball a1">•</span><span class="ambient-ball a2">•</span><span class="ambient-ball a3">•</span>
            <span class="ambient-ball a4">•</span><span class="ambient-ball a5">•</span><span class="ambient-ball a6">•</span>
          </div>
          <div class="result-layer" id="resultLayer" aria-live="polite"></div>
          <div class="stage-caption" id="stageCaption"><b>●</b> Нажми число ниже — шары появятся прямо здесь</div>
        </section>

        <section class="choice-deck" aria-label="Выбор количества шаров">
          <div class="deck-head"><span>СКОЛЬКО ШАРОВ?</span><span id="selectedSize">ВЫБОР СРАЗУ</span></div>
          <div class="size-grid" role="group" aria-label="Выберите от одного до десяти шаров">
            <button class="size-button" type="button" data-size="1">01</button><button class="size-button" type="button" data-size="2">02</button><button class="size-button" type="button" data-size="3">03</button><button class="size-button" type="button" data-size="4">04</button><button class="size-button" type="button" data-size="5">05</button>
            <button class="size-button" type="button" data-size="6">06</button><button class="size-button" type="button" data-size="7">07</button><button class="size-button" type="button" data-size="8">08</button><button class="size-button" type="button" data-size="9">09</button><button class="size-button" type="button" data-size="10">10</button>
          </div>
        </section>
      </section>

      <section class="action-row" aria-label="Быстрый новый ход">
        <button class="new-button" type="button" id="newRound" disabled>ВЫБЕРИ ЧИСЛО ШАРОВ</button>
        <button class="auto-button" type="button" id="autoRound">AUTO</button>
      </section>

      <footer class="footer-line"><span>ОДИН ЭКРАН · БЕЗ ПРОКРУТКИ</span><span><b>●</b> КРАСНЫЙ / БЕЛЫЙ / СИНИЙ</span></footer>
    </main>
  </div>

  <script>
    (() => {
      // Это локальная игровая сцена: выбранный размер и номера не отправляются в бот.
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      const stage = document.getElementById('stage');
      const resultLayer = document.getElementById('resultLayer');
      const newRound = document.getElementById('newRound');
      const autoRound = document.getElementById('autoRound');
      const roundChip = document.getElementById('roundChip');
      const stageCaption = document.getElementById('stageCaption');
      const selectedSize = document.getElementById('selectedSize');
      const sizeButtons = [...document.querySelectorAll('.size-button')];
      let selectedAmount = 0;
      let round = 0;
      let animating = false;

      const positions = {
        1: [[50, 48]],
        2: [[34, 49], [66, 49]],
        3: [[23, 49], [50, 40], [77, 49]],
        4: [[33, 34], [67, 34], [33, 66], [67, 66]],
        5: [[18, 49], [35, 33], [51, 58], [67, 33], [84, 49]],
        6: [[24, 31], [50, 27], [76, 31], [24, 65], [50, 71], [76, 65]],
        7: [[15, 29], [38, 25], [62, 25], [85, 29], [27, 66], [50, 72], [73, 66]],
        8: [[14, 28], [38, 25], [62, 25], [86, 28], [14, 67], [38, 71], [62, 71], [86, 67]],
        9: [[12, 26], [31, 24], [50, 23], [69, 24], [88, 26], [21, 68], [40, 71], [60, 71], [79, 68]],
        10: [[11, 25], [30, 24], [50, 23], [70, 24], [89, 25], [11, 68], [30, 71], [50, 72], [70, 71], [89, 68]]
      };

      function syncViewport() {
        const height = tg && tg.viewportStableHeight ? tg.viewportStableHeight : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', `${Math.round(height)}px`);
      }

      function haptic(type = 'light') {
        if (!tg || !tg.HapticFeedback) return;
        if (type === 'selection') tg.HapticFeedback.selectionChanged();
        else tg.HapticFeedback.impactOccurred(type);
      }

      function formatNumber(number) { return String(number).padStart(2, '0'); }

      function createUniqueNumbers(amount) {
        const pool = Array.from({ length: 80 }, (_, index) => index + 1);
        for (let index = pool.length - 1; index > 0; index--) {
          const other = Math.floor(Math.random() * (index + 1));
          [pool[index], pool[other]] = [pool[other], pool[index]];
        }
        return pool.slice(0, amount);
      }

      function setBusy(busy) {
        animating = busy;
        sizeButtons.forEach(button => { button.disabled = busy; });
        autoRound.disabled = busy;
        newRound.disabled = busy || !selectedAmount;
      }

      function selectSize(amount) {
        selectedAmount = amount;
        sizeButtons.forEach(button => button.classList.toggle('selected', Number(button.dataset.size) === amount));
        selectedSize.textContent = `ВЫБРАНО ${formatNumber(amount)}`;
        newRound.textContent = `НОВЫЙ ХОД · ${formatNumber(amount)}`;
      }

      function clearResult() {
        resultLayer.innerHTML = '';
      }

      function showBalls(numbers) {
        clearResult();
        numbers.forEach((number, index) => {
          const ball = document.createElement('span');
          const [x, y] = positions[numbers.length][index];
          ball.className = `result-ball${index === 0 ? ' hot' : ''}`;
          ball.textContent = formatNumber(number);
          ball.style.setProperty('--x', `${x}%`);
          ball.style.setProperty('--y', `${y}%`);
          ball.style.setProperty('--delay', `${index * 75}ms`);
          resultLayer.appendChild(ball);
        });
      }

      function playRound(amount) {
        if (animating || !Number.isInteger(amount) || amount < 1 || amount > 10) return;
        selectSize(amount);
        setBusy(true);
        stage.classList.add('has-result');
        clearResult();
        round += 1;
        roundChip.textContent = `ХОД ${formatNumber(round)} · ${formatNumber(amount)}`;
        roundChip.classList.add('ready');
        stageCaption.innerHTML = '<b>●</b> Шары собираются в поле';
        haptic('selection');
        const numbers = createUniqueNumbers(amount);
        window.setTimeout(() => showBalls(numbers), 220);
        window.setTimeout(() => {
          stageCaption.innerHTML = '<b>●</b> Готово — «Новый ход» повторит тот же размер';
          setBusy(false);
        }, 880 + Math.min(amount, 7) * 75);
      }

      sizeButtons.forEach(button => {
        button.addEventListener('click', () => playRound(Number(button.dataset.size)));
      });
      newRound.addEventListener('click', () => playRound(selectedAmount));
      autoRound.addEventListener('click', () => playRound(1 + Math.floor(Math.random() * 10)));

      if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#05080d');
        tg.setBackgroundColor('#05080d');
        tg.onEvent('viewportChanged', syncViewport);
      }
      window.addEventListener('resize', syncViewport);
      syncViewport();
    })();
  </script>
</body>
</html>
